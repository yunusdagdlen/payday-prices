name: Fiyatları güncelle

on:
  schedule:
    # TCMB kurları 15:30'da (TSİ) açıklanır; 13:00 UTC = 16:00 TSİ, hafta içi
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiyatları çek
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python scripts/update_prices.py

      - name: Değiştiyse commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          # Sadece updatedAt değiştiyse de commit edilir; uygulama son kontrol zamanını görür.
          git diff --cached --quiet && exit 0
          git commit -m "Fiyatlar: $(date -u +%Y-%m-%d)"
          git push
